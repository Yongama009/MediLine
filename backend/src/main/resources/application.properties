spring.application.name=clinic-queue

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:mediline}
spring.datasource.password=${DB_PASSWORD:mediline}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=filesystem:../database/migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false

spring.sql.init.mode=never

server.port=5000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
# Set ADMIN_REGISTRATION_CODE in the environment to enable admin registration.
admin.registration.code=${ADMIN_REGISTRATION_CODE:}

