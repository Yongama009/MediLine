spring.application.name=clinic-queue

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediline}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=filesystem:../database/migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false

spring.sql.init.mode=never

server.port=8080
# Admin registration secret. Change this in production or set an env var ADMIN_REGISTRATION_CODE.
admin.registration.code=ADMIN_SECRET_2024
