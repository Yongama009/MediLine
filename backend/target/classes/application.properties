spring.application.name=clinic-queue

spring.datasource.url=${DB_URL:jdbc:h2:./data/mediline;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=filesystem:../database/migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false

spring.sql.init.mode=never

server.port=8080
# Admin registration secret. Change this in production or set an env var ADMIN_REGISTRATION_CODE.
admin.registration.code=ADMIN_SECRET_2024

